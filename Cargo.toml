[package]
name = "pyes"
version = "0.1.0"
authors = ["Matt Cavender"]
description = "Prefix each input record with the probability that Jev answers yes to each question"
license = "MIT"
repository = "https://github.com/visionsofparadise/pyes"
publish = false
edition = "2021"
rust-version = "1.88"

[lints.rust]
nonstandard_style = "deny"

[profile.dev]
debug = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
httpdate = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tiktoken-rs = "0.12"
