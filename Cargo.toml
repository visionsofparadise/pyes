[package]
name = "pyes"
version = "0.1.0"
authors = ["Matt Cavender"]
description = "Prefix each input record with the probability that Jev answers yes to each question"
license = "MIT"
repository = "https://github.com/visionsofparadise/pyes"
publish = false
edition = "2021"
rust-version = "1.88"

[lints.rust]
nonstandard_style = "deny"

[profile.dev]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
httpdate = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tiktoken-rs = "0.12"
ureq = "3.4"

[package.metadata.packager]
product-name = "pyes"
identifier = "com.visionsofparadise.pyes"
publisher = "Matt Cavender"
icons = ["packaging/icon.png"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
template = "packaging/installer.nsi"

[package.metadata.packager.appimage]
files = { "target/x86_64-unknown-linux-musl/release/pyes" = "usr/share/pyes/pyes" }
